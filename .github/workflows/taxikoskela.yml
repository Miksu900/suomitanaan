name: taxikoskela.fi
# Taksi Koskela (Koskelan Autopalvelu Oy) – staattiset sivut Cloudflare Workeriin. Domain kytketään, kun taxikoskela.fi on aktiivinen Cloudflaressa.
on:
  push:
    branches: [main]
    paths: ["taxikoskela/**", ".github/workflows/taxikoskela.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"   # tarkistaa 2 h välein, kunnes domain on aktiivinen ja kytketty
jobs:
  julkaise:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Domainin tila
        id: cf
        run: |
          h=(-sS -H "Authorization: Bearer $CF")
          echo "account=$(curl "${h[@]}" "$API/accounts" | jq -r '.result[0].id')" >> $GITHUB_OUTPUT
          T=$(curl "${h[@]}" "$API/zones?name=taxikoskela.fi" | jq -r '.result[0].status // "puuttuu"'); echo "tila=$T" >> $GITHUB_OUTPUT
          echo "::notice title=taxikoskela.fi Cloudflaressa::$T"
      - name: Sivut
        if: github.event_name != 'schedule' || steps.cf.outputs.tila == 'active'
        run: pip install pillow >/dev/null 2>&1 || true; python3 taxikoskela/rakenna.py
      - name: Julkaise
        if: github.event_name != 'schedule' || steps.cf.outputs.tila == 'active'
        working-directory: taxikoskela
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
        run: |
          set -e
          {
            echo 'name = "taxikoskela"'
            echo 'main = "src/index.js"'
            echo 'compatibility_date = "2026-09-01"'
            echo 'workers_dev = true'
            if [ "${{ steps.cf.outputs.tila }}" = "active" ]; then
              echo 'routes = [ { pattern = "taxikoskela.fi", custom_domain = true }, { pattern = "www.taxikoskela.fi", custom_domain = true } ]'
            fi
            echo '[assets]'
            echo 'directory = "./public"'
            echo 'binding = "ASSETS"'
            echo 'run_worker_first = true'
            echo 'not_found_handling = "404-page"'
          } > wrangler.toml
          npx --yes wrangler@4.152.0 deploy
          if [ "${{ steps.cf.outputs.tila }}" = "active" ]; then
            sleep 15
            echo "::notice title=Testi::$(curl -s -o /dev/null -w '%{http_code}' https://taxikoskela.fi/ || true) $(curl -s -o /dev/null -w '%{http_code}' https://taxikoskela.fi/taksi-kalajoki/ || true)"
          fi
