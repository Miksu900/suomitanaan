name: Omalahja kuvat
# Etusivun kuvat: haku (Unsplash-ehdokkaat), esimerkit (renderöi esimerkkituotteet live-suunnittelijalla), kaappaus (live-kuvakaappaukset).
# Tulokset haaraan omalahja-tmp (väliaikainen, poistetaan tarkistuksen jälkeen).
on:
  workflow_dispatch:
    inputs:
      tila: { description: "haku | esimerkit | kaappaus | testi | lammita | kdiag | siivoa", required: true, default: "haku" }
      haut: { description: "Hakusanat |-merkillä eroteltuina (haku)", required: false, default: "" }
      tarkka: { description: "Photo-id:t pilkuilla isoina esikatseluina (haku)", required: false, default: "" }
      ids: { description: "Photo-id:t pilkuilla kontaktiarkeiksi (haku)", required: false, default: "" }
permissions: { contents: write }
jobs:
  aja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unsplash-ehdokkaat
        if: inputs.tila == 'haku'
        env: { HAUT: "${{ inputs.haut }}", TARKKA: "${{ inputs.tarkka }}", IDS: "${{ inputs.ids }}" }
        run: |
          pip install -q pillow
          if [ -z "$HAUT" ]; then unset HAUT; fi
          if [ -n "$TARKKA" ]; then mkdir -p out; for id in ${TARKKA//,/ }; do curl -sS -o "out/$id.jpg" "https://images.unsplash.com/$id?auto=format&fit=crop&w=1200&q=70&fm=jpg"; done; else python3 kauppa/omalahja_kuvahaku.py; fi
      - name: Esimerkkituotteet
        if: inputs.tila == 'esimerkit'
        run: |
          npm i -s playwright@1.48.2 sharp@0.33.5 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p out && node kauppa/omalahja_esimerkit.mjs
      - name: Karttarajapinnan diagnoosi
        if: inputs.tila == 'kdiag'
        run: |
          node -e '
          const m = require("fs").readFileSync("faktapiste/src/omalahja.js","utf8");
          const f = m.slice(m.indexOf("const KARTTA_TASOT"), m.indexOf("async function haeOverpass"));
          eval(f.replace(/export /g,"") + ";globalThis.R=karttaRuutu;globalThis.Q=overpassKysely;");
          require("fs").writeFileSync("q.txt", Q(R(64.0736,24.5341,1.8)));'
          head -c 600 q.txt; echo
          for u in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            echo "::notice title=Suoraan $u::$(curl -sS -m 90 -o o.json -w '%{http_code} %{size_download} %{time_total}' -A 'Omalahja/1.0 (+https://omalahja.fi; info@omalahja.fi)' --data-urlencode data@q.txt $u) $(head -c 200 o.json | tr '\n' ' ')"
          done
          echo "::notice title=Worker Ylivieska::$(curl -sS -m 120 -o w.json -w '%{http_code} %{size_download} %{time_total}' 'https://omalahja.fi/api/kartta/alue?lat=64.0736&lon=24.5341&sade=1.8') $(head -c 300 w.json)"
          echo "::notice title=Worker haku::$(curl -sS -m 30 -w ' %{http_code} %{time_total}' 'https://omalahja.fi/api/kartta/haku?q=Kuopio&fi=1' | head -c 300)"
      - name: Esilaske karttojen data (valmiit paikat ja suurimmat kaupungit)
        if: inputs.tila == 'lammita'
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          export HALLINTA=$(printf '%s' "$CLOUDFLARE_API_TOKEN-faktapiste" | sha256sum | cut -c1-40)
          python3 kauppa/omalahja_karttaesilaskenta.py
      - name: Live-testi (kartat ja ohjaimet, mobiili)
        if: inputs.tila == 'testi'
        run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p out && (node kauppa/omalahja_karttatesti.mjs || true) && (node kauppa/omalahja_nimitesti.mjs || true) && node kauppa/omalahja_kaappaus.mjs
      - name: Live-kuvakaappaukset
        if: inputs.tila == 'kaappaus'
        run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p out && node -e '
          const { chromium } = require("playwright");
          (async () => { const b = await chromium.launch();
            for (const [w, h] of [[390, 900], [1280, 800]]) {
              const p = await b.newPage({ viewport: { width: w, height: h }, deviceScaleFactor: w < 500 ? 2 : 1 });
              await p.goto("https://omalahja.fi/?v=" + Date.now(), { waitUntil: "networkidle" });
              const hh = await p.evaluate(() => document.body.scrollHeight);
              for (let y = 0; y < hh; y += 400) { await p.evaluate((y) => scrollTo(0, y), y); await p.waitForTimeout(150); }
              await p.evaluate(() => scrollTo(0, 0)); await p.waitForTimeout(1500);
              await p.screenshot({ path: `out/etusivu-${w}.png` });
              await p.screenshot({ path: `out/etusivu-${w}-koko.jpg`, fullPage: true, type: "jpeg", quality: 70 });
              console.log("::notice title=Vaakavieritys " + w + "::" + await p.evaluate(() => document.documentElement.scrollWidth));
              await p.close(); }
            await b.close(); })();'
      - name: Poista väliaikainen haara
        if: inputs.tila == 'siivoa'
        run: git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" --delete omalahja-tmp
      - name: Tallenna haaraan
        if: always() && inputs.tila != 'siivoa'
        run: |
          cd out && git init -q -b omalahja-tmp && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm "${{ inputs.tila }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" omalahja-tmp
