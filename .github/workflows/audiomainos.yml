name: Audiomainos (ElevenLabs → haara audio + Telegram)
# Tekee 30 s audiomainoksen (esim. Spotify): puhe Christofferin äänellä 1.05x + hiljainen taustamatto.
on:
  workflow_dispatch:
    inputs:
      teksti: { description: "Puhuttava teksti", required: true }
      nimi: { description: "Tiedoston nimi ilman päätettä", required: true, default: "audiomainos" }
      voice: { description: "ElevenLabs voice_id", required: false, default: "3OArekHEkHv5XvmZirVD" }
permissions:
  contents: write
jobs:
  aani:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Puhe
        env: { EL: "${{ secrets.ELEVENLABS_API_KEY }}", TEKSTI: "${{ inputs.teksti }}", VOICE: "${{ inputs.voice }}" }
        run: |
          set -e
          jq -n --arg t "$TEKSTI" '{text: $t, model_id: "eleven_multilingual_v2", voice_settings: {stability: 0.5, similarity_boost: 0.8, style: 0.3}}' > body.json
          curl -sS -f -X POST "https://api.elevenlabs.io/v1/text-to-speech/$VOICE?output_format=mp3_44100_192" -H "xi-api-key: $EL" -H "content-type: application/json" -d @body.json -o puhe.mp3
      - name: Miksaus
        env: { NIMI: "${{ inputs.nimi }}" }
        run: |
          set -e
          ffmpeg -y -i puhe.mp3 -af "atempo=1.05,adelay=400|400,apad=pad_dur=1.2,loudnorm=I=-16:TP=-1.5:LRA=9" -ar 44100 -ac 2 puhe2.wav
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 puhe2.wav)
          # pehmeä taustamatto: kolmen siniaallon sointu, hidas tremolo, häivytykset
          ffmpeg -y -f lavfi -i "aevalsrc='0.5*sin(2*PI*220*t)+0.35*sin(2*PI*277.18*t)+0.3*sin(2*PI*329.63*t)+0.15*sin(2*PI*440*t)':s=44100:d=$D" \
            -af "tremolo=f=0.25:d=0.35,lowpass=f=1800,volume=0.045,afade=t=in:d=1.5,afade=t=out:st=$(echo "$D-1.8"|bc):d=1.8" -ac 2 matto.wav
          ffmpeg -y -i puhe2.wav -i matto.wav -filter_complex "[0:a][1:a]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.95" -b:a 192k "$NIMI.mp3"
          echo "::notice title=Kesto::$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$NIMI.mp3") s"
      - name: Haaraan audio
        env: { GH_TOKEN: "${{ github.token }}", NIMI: "${{ inputs.nimi }}" }
        run: |
          set -e
          mkdir out && cp "$NIMI.mp3" out/ && cd out && git init -q && git checkout -q -b audio
          git -c user.name=bot -c user.email=bot@x add . && git -c user.name=bot -c user.email=bot@x commit -qm audio
          git push -qf "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}" audio
      - name: Telegramiin
        env: { TG: "${{ secrets.TELEGRAM_BOT_TOKEN }}", NIMI: "${{ inputs.nimi }}" }
        run: curl -sS -X POST "https://api.telegram.org/bot$TG/sendAudio" -F chat_id=1893930799 -F audio=@"$NIMI.mp3" -F "caption=Audiomainos: $NIMI" | jq -c .ok
