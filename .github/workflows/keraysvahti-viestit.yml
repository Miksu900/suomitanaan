name: Keräysvahdin huijauskertomukset (Cloudflare Worker)
# Vastaanottaa keraysvahti.fi/huijaukset/kerro/ -lomakkeen nimettömät viestit: tallennus KV:hen ja sähköposti ylläpitäjälle.
on:
  push:
    branches: [main]
    paths: ["keraysvahti-viestit/**", ".github/workflows/keraysvahti-viestit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  julkaise:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tili ja tallennustila
        id: cf
        run: |
          set -e
          h=(-sS -H "Authorization: Bearer $CF" -H "Content-Type: application/json")
          A=$(curl "${h[@]}" "$API/accounts" | jq -r '.result[0].id'); echo "account=$A" >> $GITHUB_OUTPUT
          KV=$(curl "${h[@]}" "$API/accounts/$A/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="keraysvahti-viestit") | .id' | head -1)
          [ -n "$KV" ] || KV=$(curl "${h[@]}" -X POST "$API/accounts/$A/storage/kv/namespaces" -d '{"title":"keraysvahti-viestit"}' | jq -r '.result.id')
          echo "kv=$KV" >> $GITHUB_OUTPUT
          SUB=$(curl "${h[@]}" "$API/accounts/$A/workers/subdomain" | jq -r '.result.subdomain // empty'); echo "sub=$SUB" >> $GITHUB_OUTPUT
      - name: Julkaise
        working-directory: keraysvahti-viestit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
        run: |
          set -e
          cat > wrangler.toml <<EOF
          name = "keraysvahti-viestit"
          main = "src/index.js"
          compatibility_date = "2026-09-01"
          workers_dev = true
          [[kv_namespaces]]
          binding = "DB"
          id = "${{ steps.cf.outputs.kv }}"
          EOF
          sed -i 's/^ *//' wrangler.toml
          npx --yes wrangler@3.99.0 deploy
          L=$(npx --yes wrangler@3.99.0 secret list 2>/dev/null || true)
          echo "$L" | grep -q SUOLA || node -e 'console.log(require("crypto").randomBytes(16).toString("hex"))' | tr -d '\n' | npx --yes wrangler@3.99.0 secret put SUOLA
          if [ -n "${{ secrets.BREVO_API_KEY }}" ]; then printf '%s' "${{ secrets.BREVO_API_KEY }}" | npx --yes wrangler@3.99.0 secret put BREVO_API_KEY; B="sähköposti käytössä"; else B="BREVO_API_KEY puuttuu: viestit tallentuvat, mutta sähköpostia ei lähde"; fi
          sleep 6
          echo "::notice title=Osoite::https://keraysvahti-viestit.${{ steps.cf.outputs.sub }}.workers.dev ($B) $(curl -s https://keraysvahti-viestit.${{ steps.cf.outputs.sub }}.workers.dev/)"
