name: Tagitesti (netvo.fi)
on: workflow_dispatch
jobs:
  testaa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node mainokset/tagitesti.mjs
