name: Domainit Cloudflareen
# Lisää domainit Cloudflare-tiliin ja kertoo nimipalvelimet, jotka vaihdetaan Domainhotelliin.
on:
  workflow_dispatch:
    inputs:
      domainit: { description: "Domainit välilyönnillä", default: "faktapiste.fi pykalavahti.fi" }
jobs:
  lisaa:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API: https://api.cloudflare.com/client/v4
    steps:
      - run: |
          h=(-sS -H "Authorization: Bearer $CF" -H "Content-Type: application/json")
          A=$(curl "${h[@]}" "$API/accounts" | jq -r '.result[0].id')
          for d in ${{ inputs.domainit }}; do
            Z=$(curl "${h[@]}" "$API/zones?name=$d" | jq -c '.result[0] // empty')
            if [ -z "$Z" ]; then
              R=$(curl "${h[@]}" -X POST "$API/zones" -d "{\"name\":\"$d\",\"account\":{\"id\":\"$A\"},\"type\":\"full\"}")
              echo "$R" | jq -c '.errors' ; Z=$(echo "$R" | jq -c '.result // empty')
            fi
            [ -n "$Z" ] && echo "::notice title=$d::tila $(echo "$Z" | jq -r .status) | nimipalvelimet: $(echo "$Z" | jq -r '.name_servers|join(" ja ")')" || echo "::warning title=$d::ei onnistunut"
          done
