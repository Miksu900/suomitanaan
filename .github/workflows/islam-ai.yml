name: Islam-tekoäly testi
# faktapiste.fi/islam/ "Kysy tekoälyltä": luotaa (mallit ja työkaluversiot), kysy (live-kysymykset lokiin), kaappaus (mobiilikuvat haaraan islam-ai-tmp), siivoa.
on:
  workflow_dispatch:
    inputs:
      tila: { description: "luotaa | kysy | kaappaus | siivoa", required: true, default: "kysy" }
      kysymykset: { description: "Kysymykset |-merkillä eroteltuina (kysy). Tyhjä = vakiotestit", required: false, default: "" }
permissions: { contents: write }
jobs:
  aja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Luotaa mallit ja työkalut
        if: inputs.tila == 'luotaa'
        env: { AK: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          H=(-sS -H "x-api-key: $AK" -H "anthropic-version: 2023-06-01" -H "content-type: application/json")
          echo "MALLIT:"; curl "${H[@]}" "https://api.anthropic.com/v1/models?limit=40" | jq -r '.data[]? | "\(.id)  \(.created_at)"'
          SYS=$(python3 -c "print('Olet avulias tutkija. ' * 400)")
          for i in 1 2; do
            curl "${H[@]}" https://api.anthropic.com/v1/messages -d "$(jq -n --arg s "$SYS" '{model:"claude-sonnet-5-5",max_tokens:5,cache_control:{type:"ephemeral"},system:$s,messages:[{role:"user",content:"Sano ok"}]}')" | jq -c '{e:.error.message,u:.usage}'
          done
          curl "${H[@]}" https://api.anthropic.com/v1/messages -d '{"model":"claude-sonnet-5-5","max_tokens":400,"stream":true,"tools":[{"type":"web_search_20260209","name":"web_search","max_uses":2}],"messages":[{"role":"user","content":"Hae verkosta: Järvenpään moskeija rakennusvuosi. Vastaa yhdellä lauseella."}]}' > st.txt
          grep '^data:' st.txt | sed 's/^data: //' | jq -c 'select(.type=="content_block_start" or .type=="message_delta" or (.type=="content_block_delta" and .delta.type=="input_json_delta")) | (.content_block // .delta // .) | if .type=="web_search_tool_result" then {type, n:(.content|length)} elif .type=="code_execution_tool_result" or .type=="bash_code_execution_tool_result" then {type} else . end' | head -c 4000
      - name: Ei
        if: false
        run: |
          echo
      - name: Kysy live-sivulta
        if: inputs.tila == 'kysy'
        env: { KYS: "${{ inputs.kysymykset }}", CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          HALLINTA=$(printf '%s' "$CLOUDFLARE_API_TOKEN-faktapiste" | sha256sum | cut -c1-40)
          export OMA=$(printf '%s' "$HALLINTA-islamkysy" | sha256sum | cut -c1-32)
          mkdir -p out
          node .github/islam-ai-testi.mjs
      - name: Mobiilikuvat
        if: inputs.tila == 'kaappaus'
        run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p out && node .github/islam-ai-kuvat.cjs
      - name: Poista väliaikainen haara
        if: inputs.tila == 'siivoa'
        run: git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" --delete islam-ai-tmp
      - name: Tallenna haaraan
        if: always() && (inputs.tila == 'kaappaus' || inputs.tila == 'kysy')
        run: |
          cd out && git init -q -b islam-ai-tmp && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm "${{ inputs.tila }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" islam-ai-tmp
