name: Islam-tekoäly testi
# faktapiste.fi/islam/ "Kysy tekoälyltä": luotaa (mallit ja työkaluversiot), kysy (live-kysymykset lokiin), kaappaus (mobiilikuvat haaraan islam-ai-tmp), siivoa.
on:
  workflow_dispatch:
    inputs:
      tila: { description: "luotaa | kysy | kaappaus | raja | siivoa", required: true, default: "kysy" }
      kysymykset: { description: "Kysymykset |-merkillä eroteltuina (kysy). Tyhjä = vakiotestit", required: false, default: "" }
permissions: { contents: write }
jobs:
  aja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Luotaa mallit ja työkalut
        if: inputs.tila == 'luotaa'
        env: { AK: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          H=(-sS -H "x-api-key: $AK" -H "anthropic-version: 2023-06-01" -H "content-type: application/json")
          echo "MALLIT:"; curl "${H[@]}" "https://api.anthropic.com/v1/models?limit=40" | jq -r '.data[]? | "\(.id)  \(.created_at)"'
          B=https://avoindata.prh.fi/opendata-ytj-api/v3
          for C in YRMU SELTILA REK_KDI TLAJI KIELI; do echo "KOODI $C: $(curl -sS "$B/description?code=$C&lang=fi" | head -c 1500)"; done
          echo "PAGE: $(curl -sS "$B/companies?name=yhdistys&page=2" | jq -c '{n:.totalResults, k:(.companies|length)}')"
          echo "LOM: $(curl -sS "$B/companies?name=islam&companyForm=16" | jq -c '{n:.totalResults}')"
          for Q in "Suomen Islamilainen Yhdyskunta" "Islamilainen" "Suomen Islam-seurakunta" "Rabita" "moske"; do echo "Q $Q: $(curl -sS -G "$B/companies" --data-urlencode "name=$Q" | jq -c '{n:.totalResults, x:[.companies[:8][]|{id:.businessId.value,n:([.names[]|select(.endDate==null)|.name][0]),s:.status,t:.tradeRegisterStatus,e:.endDate,r:[.registeredEntries[]?|select(.endDate==null)|{t:.type,r:.register,a:.authority}]}]}' | head -c 1800)"; done
      - name: Ei
        if: false
        run: |
          echo
      - name: Kysy live-sivulta
        if: inputs.tila == 'kysy'
        env: { KYS: "${{ inputs.kysymykset }}", CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          HALLINTA=$(printf '%s' "$CLOUDFLARE_API_TOKEN-faktapiste" | sha256sum | cut -c1-40)
          export OMA=$(printf '%s' "$HALLINTA-islamkysy" | sha256sum | cut -c1-32)
          mkdir -p out
          node .github/islam-ai-testi.mjs
      - name: Rajatesti (ilman omistajakoodia)
        if: inputs.tila == 'raja'
        run: |
          curl -sS -N --max-time 25 -X POST -H 'content-type: application/json' -d '{"kysymys":"Mitä zakat tarkoittaa? Vastaa yhdellä lauseella ilman hakuja."}' https://faktapiste.fi/api/islam/kysy | head -c 1500 || true
      - name: Mobiilikuvat
        if: inputs.tila == 'kaappaus'
        env: { KYSYMYS: "${{ inputs.kysymykset }}", CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          HALLINTA=$(printf '%s' "$CLOUDFLARE_API_TOKEN-faktapiste" | sha256sum | cut -c1-40)
          export OMA=$(printf '%s' "$HALLINTA-islamkysy" | sha256sum | cut -c1-32); echo "::add-mask::$OMA"
          if [ -z "$KYSYMYS" ]; then unset KYSYMYS; fi
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p out && node .github/islam-ai-kuvat.cjs
      - name: Poista väliaikainen haara
        if: inputs.tila == 'siivoa'
        run: git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" --delete islam-ai-tmp
      - name: Tallenna haaraan
        if: always() && (inputs.tila == 'kaappaus' || inputs.tila == 'kysy')
        run: |
          cd out && git init -q -b islam-ai-tmp && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm "${{ inputs.tila }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" islam-ai-tmp
