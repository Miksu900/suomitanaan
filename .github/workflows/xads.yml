name: X Ads
# X-mainosten hallinta (OAuth 1.0a). Avaimet vain GitHubin salaisuuksissa.
# Push ajaa vain lukevan tilan. Pysäytys tehdään käsin vain omistajan luvalla.
on:
  push:
    branches: [main]
    paths: ["mainokset/xads.py", ".github/workflows/xads.yml"]
  workflow_dispatch:
    inputs:
      toiminto: { description: "tila, tutki, uusimmat, mainosta, luo, viimeistele, kaynnista, pysayta tai poista", required: true, default: "tila" }
      tili: { description: "Mainostilin id (pysayta)", required: false, default: "" }
      kampanja: { description: "Kampanjan id (pysayta)", required: false, default: "" }
      asetukset: { description: "JSON (luo)", required: false, default: "" }
jobs:
  ajo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          ASETUKSET: ${{ inputs.asetukset }}
        run: |
          if [ "${{ inputs.toiminto }}" = "luo" ]; then git fetch -q origin xmedia && git show origin/xmedia:video.mp4 > mainokset/video.mp4 && ls -la mainokset/video.mp4; fi
          cd mainokset
          for k in X_API_KEY X_API_SECRET X_ACCESS_TOKEN X_ACCESS_SECRET; do [ -n "${!k}" ] || echo "::error::Salaisuus $k puuttuu"; done
          python3 xads.py "${{ inputs.toiminto || 'tila' }}" ${{ inputs.tili }} ${{ inputs.kampanja }}
