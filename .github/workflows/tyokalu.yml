name: Työkalu (testikooste, ääni, haku)
on:
  workflow_dispatch:
    inputs:
      toiminto: { description: "kooste, aani, haku tai teksti (puheentunnistus haarasta stt-in)", required: true }
      teksti: { description: "Teksti äänelle tai haettavat osoitteet välilyönnillä", required: false, default: "" }
      aani: { description: "ElevenLabs-äänen nimi tai voice_id (oletus Christoffer, suomi)", required: false, default: "3OArekHEkHv5XvmZirVD" }
permissions:
  contents: write
jobs:
  aja:
    runs-on: ubuntu-latest
    steps:
      - name: Testikooste
        if: inputs.toiminto == 'kooste'
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PW: ${{ secrets.TOIMITUS_SALASANA }}
        run: |
          h=(-sS -H "Authorization: Bearer $CF")
          A=$(curl "${h[@]}" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          SUB=$(curl "${h[@]}" "https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain" | jq -r '.result.subdomain')
          R=$(curl -sS -H "Authorization: Bearer $PW" "https://suomitanaan.$SUB.workers.dev/api/kooste")
          echo "::notice title=Kooste::$R"
      - name: Haku
        if: inputs.toiminto == 'haku'
        env:
          URLS: ${{ inputs.teksti }}
        run: |
          mkdir out; i=0; for u in $URLS; do i=$((i+1)); curl -sSL -A "Mozilla/5.0" "$u" -o "out/$i.txt"; echo "$i $u" >> out/hakemisto.txt; done
          cd out && git init -q && git checkout -q -b haku && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm haku
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" haku
      - name: Ääni ElevenLabsilla
        if: inputs.toiminto == 'aani'
        env:
          EL: ${{ secrets.ELEVENLABS_API_KEY }}
          TEKSTI: ${{ inputs.teksti }}
          NIMI: ${{ inputs.aani }}
        run: |
          set -e
          if echo "$NIMI" | grep -Eq '^[A-Za-z0-9]{20}$'; then V="$NIMI"; else
          V=$(curl -sS -H "xi-api-key: $EL" https://api.elevenlabs.io/v1/voices | jq -r --arg n "$NIMI" '[.voices[] | select(.name|ascii_downcase|startswith($n|ascii_downcase))][0].voice_id'); fi
          echo "::notice title=Ääni::$NIMI = $V"
          mkdir out && jq -n --arg t "$TEKSTI" '{text:$t, model_id:"eleven_multilingual_v2", voice_settings:{stability:0.45, similarity_boost:0.8, style:0.35}}' > body.json
          curl -sS -f -X POST "https://api.elevenlabs.io/v1/text-to-speech/$V/with-timestamps?output_format=mp3_44100_128" -H "xi-api-key: $EL" -H "content-type: application/json" -d @body.json -o out/vastaus.json
          jq -r .audio_base64 out/vastaus.json | base64 -d > out/aani.mp3 && jq .alignment out/vastaus.json > out/ajoitus.json && rm out/vastaus.json
          cd out && git init -q && git checkout -q -b aani && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm aani
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" aani
      - name: Puheentunnistus ElevenLabsilla
        if: inputs.toiminto == 'teksti'
        env:
          EL: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          curl -sSL -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/${{ github.repository }}/contents/puhe.mp3?ref=stt-in" -o puhe.mp3; ls -la puhe.mp3
          mkdir out && curl -sS -X POST https://api.elevenlabs.io/v1/speech-to-text -H "xi-api-key: $EL" -F model_id=scribe_v1 -F language_code=fin -F timestamps_granularity=word -F file=@puhe.mp3 > out/teksti.json
          jq -r .text out/teksti.json | head -c 2000
          cd out && git init -q && git checkout -q -b stt && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm stt
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" stt
