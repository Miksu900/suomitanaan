name: Hankintavahti
# Hakee Hilmasta (avoin rajapinta, CC BY 4.0) uudet hankintailmoitukset. Toiminto "testi" tarkistaa avaimen ja tallentaa näytteen haaraan hv-data.
on:
  workflow_dispatch:
    inputs:
      toiminto: { description: "testi", required: true, default: "testi" }
      paivat: { description: "Montako päivää taaksepäin", required: false, default: "7" }
permissions: { contents: write }
jobs:
  aja:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.HILMA_API_KEY }}
    steps:
      - name: Testihaku
        run: |
          set -e
          [ -n "$KEY" ] || { echo "::error::HILMA_API_KEY puuttuu"; exit 1; }
          C=$(date -u -d "-${{ inputs.paivat }} days" +%Y-%m-%dT%H:%M:%SZ)
          mkdir out
          jq -n --arg c "$C" '{search:"*", top:100, count:true, orderby:"datePublished desc", searchMode:"any", queryType:"simple",
            filter:("datePublished ge " + $c + " and mainType eq '"'"'ContractNotices'"'"'"),
            select:"noticeId,titleFi,organisationNameFi,organisationNationalRegistrationNumber,cpvCodes,nutsCodes,datePublished,expirationDate,estimatedValue,procedureType,procurementTypeCode,mainType,eFormsId,procurementDocumentsUrl,descriptionFi"}' > body.json
          code=$(curl -sS -o out/naytte.json -w "%{http_code}" -X POST https://api.hankintailmoitukset.fi/avp/eformnotices/docs/search \
            -H "Ocp-Apim-Subscription-Key: $KEY" -H "Content-Type: application/json" -d @body.json)
          echo "::notice title=HTTP::$code"
          [ "$code" = 200 ] || { head -c 500 out/naytte.json; exit 1; }
          echo "::notice title=Tulos::$(jq -r '"yhteensä " + (."@odata.count"|tostring) + " ilmoitusta, näytteessä " + (.value|length|tostring)' out/naytte.json)"
          cd out && git init -q -b hv-data && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm naytte
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" hv-data
