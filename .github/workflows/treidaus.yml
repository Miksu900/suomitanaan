name: Treidausennuste (testaus)
on:
  push:
    branches: [treidaus]
    paths: ["treidaus/**", ".github/workflows/treidaus.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  testaa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas numpy lightgbm requests
      - run: python treidaus/testaa.py
      - name: Tallenna tulokset
        run: |
          git config user.name "treidaus-bot"; git config user.email "bot@users.noreply.github.com"
          git add treidaus/tulokset.md treidaus/tulokset.json
          git commit -m "Testitulokset" || true
          git push
