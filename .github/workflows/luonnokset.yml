name: Päivän uutisluonnokset
# Kirjoittaa joka päivä uutisluonnokset alkuperäislähteistä toimituksen hyväksyntäjonoon (suomitanaan.fi/toimitus).
on:
  schedule:
    - cron: "20 9 * * *"   # noin klo 12.20 Suomen aikaa, valmiina kun heräät
  workflow_dispatch:
    inputs:
      maara:
        description: "Montako luonnosta enintään"
        default: "10"
permissions:
  contents: read
concurrency:
  group: luonnokset
  cancel-in-progress: false
jobs:
  luonnokset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Selvitä toimituksen osoite
        id: osoite
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          h=(-sS -H "Authorization: Bearer $CF")
          A=$(curl "${h[@]}" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          ST=$(curl "${h[@]}" "https://api.cloudflare.com/client/v4/zones?name=suomitanaan.fi" | jq -r '.result[0].status')
          if [ "$ST" = "active" ] && curl -sf -o /dev/null https://suomitanaan.fi/api/tila; then echo "url=https://suomitanaan.fi" >> $GITHUB_OUTPUT
          else SUB=$(curl "${h[@]}" "https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain" | jq -r '.result.subdomain'); echo "url=https://suomitanaan.$SUB.workers.dev" >> $GITHUB_OUTPUT; fi
      - run: node scripts/luonnokset.mjs
        env:
          WORKER_URL: ${{ steps.osoite.outputs.url }}
          TOIMITUS_SALASANA: ${{ secrets.TOIMITUS_SALASANA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_LUONNOKSET: ${{ inputs.maara || '10' }}
