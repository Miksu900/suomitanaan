name: Faktapisteen arvonta
# Arpoo kuukauden voittajan Faktapisteen aktiivisten kirjoittajien kesken (säännöt: faktapiste.fi/arvonta/).
# Tulos (voittajan nimi ja sähköposti) tulee omistajalle Telegramiin. Sama kausi arvotaan vain kerran.
on:
  schedule:
    - cron: "7 7 1 * *"   # joka kuun 1. päivä klo 9.07 Suomen aikaa: arpoo päättyneet kaudet (1.12. 100 €, 1.2. 500 €)
  workflow_dispatch:
    inputs:
      pakota: { description: "Arvo jo ennen kauden loppua (1 = kyllä, vaatii kauden)", required: false, default: "" }
      kausi: { description: "Kausi, esim. 2026-11 tai suuri-2026-11", required: false, default: "" }
      hylkaa: { description: "Hylkää voittaja ja arvo uudelleen: tilin numero Telegram-viestistä (vaatii kauden)", required: false, default: "" }
jobs:
  arvo:
    runs-on: ubuntu-latest
    steps:
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          HALLINTA=$(printf '%s' "$CF-faktapiste" | sha256sum | cut -c1-40)
          R=$(curl -sS -X POST -H "x-avain: $HALLINTA" "https://faktapiste.fi/api/hallinta/arvonta?pakota=${{ inputs.pakota }}&kausi=${{ inputs.kausi }}&hylkaa=${{ inputs.hylkaa }}")
          echo "::notice title=Arvonta::$(echo "$R" | jq -c '[.tulokset[]? | {kausi, osallistujia, arvoja, jo, virhe, uusinta}]')"
