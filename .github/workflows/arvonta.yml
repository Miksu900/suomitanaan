name: Faktapisteen arvonta
# Arpoo kuukauden voittajan Faktapisteen aktiivisten kirjoittajien kesken (säännöt: faktapiste.fi/arvonta/).
# Tulos (voittajan nimi ja sähköposti) tulee omistajalle Telegramiin. Sama kausi arvotaan vain kerran.
on:
  schedule:
    - cron: "7 7 1 12 *"   # 1.12. klo 9.07 Suomen aikaa
  workflow_dispatch:
    inputs:
      pakota: { description: "Arvo jo ennen kauden loppua (1 = kyllä)", required: false, default: "" }
jobs:
  arvo:
    runs-on: ubuntu-latest
    steps:
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          HALLINTA=$(printf '%s' "$CF-faktapiste" | sha256sum | cut -c1-40)
          R=$(curl -sS -X POST -H "x-avain: $HALLINTA" "https://faktapiste.fi/api/hallinta/arvonta?pakota=${{ inputs.pakota }}")
          echo "::notice title=Arvonta::$(echo "$R" | jq -c '{kausi, osallistujia, arvoja, jo: (.jo != null), virhe}')"
