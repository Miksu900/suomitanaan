name: Julkaise sivusto (Cloudflare Worker)
# Julkaisee worker/-kansion Cloudflareen. Luo tarvittaessa KV-tallennustilan ja liittää suomitanaan.fi-domainin,
# kun domainin nimipalvelimet osoittavat Cloudflareen. Tarvitsee salaisuudet CLOUDFLARE_API_TOKEN ja TOIMITUS_SALASANA.
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/julkaise-worker.yml"]
  schedule:
    - cron: "17 * * * *"   # kerran tunnissa: liittää domainin heti kun se on aktiivinen
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  julkaise:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Selvitä tili, tallennustila ja domain
        id: cf
        run: |
          set -e
          h=(-sS -H "Authorization: Bearer $CF" -H "Content-Type: application/json")
          A=$(curl "${h[@]}" "$API/accounts" | jq -r '.result[0].id')
          [ -n "$A" ] && [ "$A" != "null" ] || { echo "::error::Cloudflare-tiliä ei löytynyt avaimella"; exit 1; }
          echo "account=$A" >> $GITHUB_OUTPUT
          KV=$(curl "${h[@]}" "$API/accounts/$A/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="suomitanaan-db") | .id' | head -1)
          if [ -z "$KV" ]; then
            KV=$(curl "${h[@]}" -X POST "$API/accounts/$A/storage/kv/namespaces" -d '{"title":"suomitanaan-db"}' | jq -r '.result.id')
            echo "::notice title=Tallennustila::Luotiin KV suomitanaan-db"
          fi
          echo "kv=$KV" >> $GITHUB_OUTPUT
          Z=$(curl "${h[@]}" "$API/zones?name=suomitanaan.fi" | jq -r '.result[0] | "\(.id) \(.status)"')
          ZID=${Z% *}; ZST=${Z#* }
          echo "zone=$ZID" >> $GITHUB_OUTPUT; echo "zstatus=$ZST" >> $GITHUB_OUTPUT
          echo "::notice title=Domain::suomitanaan.fi tila: $ZST"
          SUB=$(curl "${h[@]}" "$API/accounts/$A/workers/subdomain" | jq -r '.result.subdomain // empty')
          echo "sub=$SUB" >> $GITHUB_OUTPUT
      - name: Poista vanhat GitHub-osoitteet domainista (kun domain aktiivinen)
        if: steps.cf.outputs.zstatus == 'active'
        run: |
          h=(-sS -H "Authorization: Bearer $CF")
          for n in suomitanaan.fi www.suomitanaan.fi; do
            for id in $(curl "${h[@]}" "$API/zones/${{ steps.cf.outputs.zone }}/dns_records?name=$n&type=CNAME" | jq -r '.result[] | select(.content|test("github.io")) | .id'); do
              curl "${h[@]}" -X DELETE "$API/zones/${{ steps.cf.outputs.zone }}/dns_records/$id" >/dev/null && echo "poistettu $n"
            done
          done
      - name: Kirjoita asetukset ja julkaise
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
        run: |
          set -e
          if [ "${{ steps.cf.outputs.zstatus }}" = "active" ]; then SIVU_URL=https://suomitanaan.fi; else SIVU_URL=https://suomitanaan.${{ steps.cf.outputs.sub }}.workers.dev; fi
          cat > wrangler.toml <<EOF
          name = "suomitanaan"
          main = "src/index.js"
          compatibility_date = "2026-09-01"
          workers_dev = true
          [triggers]
          crons = ["0 10 * * *", "0 11 * * *"]
          [vars]
          SIVU_URL = "$SIVU_URL"
          KOOSTE_EMAIL = "miika.koskela990@gmail.com"
          [[kv_namespaces]]
          binding = "DB"
          id = "${{ steps.cf.outputs.kv }}"
          EOF
          if [ "${{ steps.cf.outputs.zstatus }}" = "active" ]; then
            printf '\n[[routes]]\npattern = "suomitanaan.fi"\ncustom_domain = true\n\n[[routes]]\npattern = "www.suomitanaan.fi"\ncustom_domain = true\n' >> wrangler.toml
          fi
          sed -i 's/^ *//' wrangler.toml
          npx --yes wrangler@3.99.0 deploy
          printf '%s' "${{ secrets.TOIMITUS_SALASANA }}" | npx --yes wrangler@3.99.0 secret put TOIMITUS_SALASANA
          if [ -n "${{ secrets.BREVO_API_KEY }}" ]; then printf '%s' "${{ secrets.BREVO_API_KEY }}" | npx --yes wrangler@3.99.0 secret put BREVO_API_KEY; echo "::notice title=Kooste::Brevo-avain asetettu"; else echo "::notice title=Kooste::BREVO_API_KEY puuttuu, sähköpostikooste ei vielä lähde"; fi
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            printf '%s' "${{ secrets.TELEGRAM_BOT_TOKEN }}" | npx --yes wrangler@3.99.0 secret put TELEGRAM_BOT_TOKEN
            printf '%s' "1893930799" | npx --yes wrangler@3.99.0 secret put TG_CHAT
            TS=$(printf '%s' "${{ secrets.TELEGRAM_BOT_TOKEN }}suomitanaan-webhook" | sha256sum | cut -c1-48)
            printf '%s' "$TS" | npx --yes wrangler@3.99.0 secret put TG_SALAISUUS
            sleep 5
            R=$(curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" -H "content-type: application/json" -d "{\"url\":\"$SIVU_URL/telegram\",\"secret_token\":\"$TS\",\"allowed_updates\":[\"message\",\"callback_query\"]}")
            echo "::notice title=Telegram::$(echo "$R" | jq -c '{ok,description}')"
          fi
          echo "::notice title=Osoite::https://suomitanaan.${{ steps.cf.outputs.sub }}.workers.dev"
