name: Mainosraportti
# Päivittäinen mainosraportti Telegramiin (n. klo 9 Suomen aikaa)
on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:
jobs:
  raportti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CID: ${{ secrets.GADS_CLIENT_ID }}
          CSEC: ${{ secrets.GADS_CLIENT_SECRET }}
          MSSEC: ${{ secrets.MSADS_CLIENT_SECRET }}
          MSDEV: ${{ secrets.MSADS_DEVELOPER_TOKEN }}
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          export HALLINTA=$(printf '%s' "$CF-faktapiste" | sha256sum | cut -c1-40)
          cd mainokset && python3 raportti.py
