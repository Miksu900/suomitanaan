name: Netvo-video (TikTokiin)
# Tekee Netvon mainosvideon: ääni ElevenLabsilla (Christoffer), renderöinti videokone/netvo_promo.py:llä,
# lähetys Telegramiin saatetekstin kanssa. Ajetaan, kun netvo-promo.json tai netvo_promo.py muuttuu, tai käsin.
on:
  push:
    branches: [main]
    paths: ["videokone/netvo-promo.json", "videokone/netvo_promo.py", ".github/workflows/netvo-video.yml"]
  workflow_dispatch:
    inputs:
      tempo: { description: "Puheen nopeutus", required: false, default: "1.05" }
      json: { description: "Käsikirjoitus videokone/-kansiossa", required: false, default: "netvo-promo.json" }
      skripti: { description: "Renderöijä videokone/-kansiossa", required: false, default: "netvo_promo.py" }
      aani: { description: "ElevenLabs voice_id (oletus Christoffer; Brian = nPczCjzI2devNBz1zQrb)", required: false, default: "3OArekHEkHv5XvmZirVD" }
concurrency: { group: netvo-video, cancel-in-progress: true }
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOICE: ${{ inputs.aani || '3OArekHEkHv5XvmZirVD' }}
      TEMPO: ${{ inputs.tempo || '1.05' }}
    steps:
      - uses: actions/checkout@v4
      - name: Työkalut
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q pillow numpy
      - name: Mallisivujen kuvat (oikeat sivut, valokuvataustat)
        continue-on-error: true
        run: |
          pip install -q playwright && python3 -m playwright install --with-deps chromium >/dev/null
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image
          with sync_playwright() as p:
              b = p.chromium.launch()
              for slug in ["kauppa-leipomo", "kauppa-kasityo"]:
                  pg = b.new_page(viewport={"width": 390, "height": 790}, device_scale_factor=1.44)
                  pg.goto(f"https://netvo.fi/mallit/{slug}/?v=video", wait_until="networkidle")
                  pg.evaluate("document.querySelectorAll('.demo').forEach(e=>e.remove());document.querySelectorAll('.hero>img').forEach(i=>i.style.animation='none')")
                  pg.wait_for_timeout(1500)
                  pg.screenshot(path=f"/tmp/{slug}.png")
                  im = Image.open(f"/tmp/{slug}.png").convert("RGB")
                  im = im.resize((560, round(im.height * 560 / im.width)))
                  im.save(f"videokone/netvo-kuvat/{slug}.jpg", quality=90)
                  print(slug, im.size)
              b.close()
          PY
      - name: Mallikauppojen kuvakaappaukset (oikeat sivut valokuvineen)
        continue-on-error: true
        run: |
          pip install -q playwright && python3 -m playwright install --with-deps chromium >/dev/null 2>&1
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image
          with sync_playwright() as p:
              b = p.chromium.launch()
              for slug in ["kauppa-leipomo", "kauppa-kasityo"]:
                  pg = b.new_page(viewport={"width": 390, "height": 790}, device_scale_factor=1.436)
                  pg.goto(f"https://netvo.fi/mallit/{slug}/?v=video", wait_until="networkidle")
                  pg.evaluate("document.querySelectorAll('.demo').forEach(e=>e.remove());document.querySelectorAll('.hero>img').forEach(i=>i.style.animation='none');document.querySelectorAll('img[loading=lazy]').forEach(i=>i.loading='eager')")
                  pg.evaluate("window.scrollTo(0, document.body.scrollHeight)"); pg.wait_for_timeout(1500); pg.evaluate("window.scrollTo(0,0)"); pg.wait_for_timeout(800)
                  pg.screenshot(path=f"/tmp/{slug}.png", full_page=True)
                  im = Image.open(f"/tmp/{slug}.png").convert("RGB"); im = im.resize((560, round(im.height * 560 / im.width)))
                  im.save(f"videokone/netvo-kuvat/{slug}-koko.jpg", quality=90); print(slug, im.size)
              b.close()
          PY
      - name: Ääni
        env:
          EL: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -e
          mkdir tyo && cp "videokone/${{ inputs.json || 'netvo-promo.json' }}" tyo/promo.json && cd tyo
          jq '{text: (.lauseet|join(" ")), model_id: "eleven_multilingual_v2", voice_settings: {stability: 0.45, similarity_boost: 0.8, style: 0.35}}' promo.json > body.json
          curl -sS -f -X POST "https://api.elevenlabs.io/v1/text-to-speech/$VOICE/with-timestamps?output_format=mp3_44100_128" -H "xi-api-key: $EL" -H "content-type: application/json" -d @body.json -o vastaus.json
          jq -r .audio_base64 vastaus.json | base64 -d > aani.mp3 && jq .alignment vastaus.json > ajoitus.json && rm vastaus.json
      - name: Video
        working-directory: tyo
        run: python3 "../videokone/${{ inputs.skripti || 'netvo_promo.py' }}" && ls -la video.mp4
      - uses: actions/upload-artifact@v4
        with: { name: netvo-video, path: tyo/video.mp4, retention-days: 14 }
      - name: Telegramiin
        working-directory: tyo
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          T=$(jq -r '.kuvateksti + "\n\n" + ((.hashtagit // []) | map("#" + gsub(" "; "")) | join(" "))' promo.json)
          R=$(curl -sS -X POST "https://api.telegram.org/bot$TG/sendVideo" -F chat_id=1893930799 -F supports_streaming=true -F video=@video.mp4 -F "caption=$(printf '%s' "$T" | head -c 1000)")
          echo "::notice title=Telegram::$(echo "$R" | jq -c '.ok')"
          V=$(printf '🎬 Netvon TikTok-video yllä. Saateteksti kopioitavaksi:\n\n%s' "$T")
          curl -sS -X POST "https://api.telegram.org/bot$TG/sendMessage" -H "content-type: application/json" \
            -d "$(jq -n --arg t "$V" '{chat_id: "1893930799", text: $t, disable_web_page_preview: true}')" > /dev/null
