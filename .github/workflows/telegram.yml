name: Telegram-viesti (testi)
on:
  workflow_dispatch:
    inputs:
      viesti: { description: "Lähetettävä viesti", default: "Testi" }
jobs:
  laheta:
    runs-on: ubuntu-latest
    steps:
      - run: |
          R=$(curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" --data-urlencode "chat_id=1893930799" --data-urlencode "text=${{ inputs.viesti }}")
          echo "::notice title=Telegram::$(echo "$R" | jq -c '.ok')"
