name: Google Ads
# Google Ads -rajapinnan työkalu. Avaimet ovat vain GitHubin salaisuuksissa ja Faktapisteen holvissa.
on:
  workflow_dispatch:
    inputs:
      toiminto: { description: "testi, vaihda, tilit, kysely, muuta tai pysayta", required: true, default: "tilit" }
      koodi: { description: "Kertakäyttöinen kirjautumiskoodi (vaihda)", required: false, default: "" }
      asiakas: { description: "Asiakastunnus (kysely)", required: false, default: "456-672-2878" }
      kysely: { description: "GAQL-kysely", required: false, default: "" }
      versio: { description: "API-versio (tyhjä = oletus)", required: false, default: "" }
jobs:
  ajo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CID: ${{ secrets.GADS_CLIENT_ID }}
          CSEC: ${{ secrets.GADS_CLIENT_SECRET }}
          DEVTOKEN: ${{ secrets.GADS_DEVELOPER_TOKEN }}
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KOODI: ${{ inputs.koodi }}
          ASIAKAS: ${{ inputs.asiakas }}
          KYSELY: ${{ inputs.kysely }}
          GADS_VER: ${{ inputs.versio || 'v24' }}
        run: |
          for k in $KOODI; do echo "::add-mask::$k"; done
          export HALLINTA=$(printf '%s' "$CF-faktapiste" | sha256sum | cut -c1-40)
          python3 mainokset/gads.py "${{ inputs.toiminto }}"
