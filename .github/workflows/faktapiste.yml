name: Faktapiste.fi
# Rakentaa faktapiste.fi:n sivut ja keskustelun (Worker + SQLite Durable Object) ja julkaisee ne Cloudflareen.
# Domain kytketään automaattisesti, kun faktapiste.fi on aktiivinen Cloudflaressa.
on:
  push:
    branches: [main]
    paths: ["faktapiste/**", ".github/workflows/faktapiste.yml"]
  workflow_dispatch:
    inputs:
      fakta: { description: "Testikysymys faktahaulle", required: false, default: "" }
      mm: { description: "Maksumuuritesti: osoitteet välilyönnillä", required: false, default: "" }
      kutsu: { description: "Luo beta-kutsulinkki (montako käyttäjää), lähetetään Telegramiin", required: false, default: "" }
      salaus: { description: "Julkinen avain (base64 PEM), jolla kutsulinkki salataan lokiin", required: false, default: "" }
jobs:
  julkaise:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tili ja domainin tila
        id: cf
        run: |
          h=(-sS -H "Authorization: Bearer $CF")
          echo "account=$(curl "${h[@]}" "$API/accounts" | jq -r '.result[0].id')" >> $GITHUB_OUTPUT
          echo "sub=$(curl "${h[@]}" "$API/accounts/$(curl "${h[@]}" "$API/accounts" | jq -r '.result[0].id')/workers/subdomain" | jq -r '.result.subdomain // empty')" >> $GITHUB_OUTPUT
          T=$(curl "${h[@]}" "$API/zones?name=faktapiste.fi" | jq -r '.result[0].status // "puuttuu"'); echo "tila=$T" >> $GITHUB_OUTPUT
          echo "::notice title=faktapiste.fi Cloudflaressa::$T"
          N=$(curl "${h[@]}" "$API/zones?name=netvo.fi" | jq -r '.result[0].status // "puuttuu"'); echo "netvo=$N" >> $GITHUB_OUTPUT
          echo "::notice title=netvo.fi Cloudflaressa::$N"
      - name: Sivut
        run: python3 faktapiste/rakenna.py
      - name: Julkaise
        working-directory: faktapiste
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
        run: |
          set -e
          # Videoiden tallennus (R2). Jos R2 ei ole käytössä tilillä, videot pysyvät pois päältä ja sivusto toimii muuten normaalisti.
          R=$(curl -sS -X POST "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets" -H "Authorization: Bearer $CF" -H "content-type: application/json" -d '{"name":"faktapiste-videot"}' || true)
          if echo "$R" | jq -e '.success == true or ([.errors[]?.code] | index(10004))' >/dev/null 2>&1; then R2=1; echo "::notice title=Videot::R2-säiliö käytössä"; else R2=0; echo "::warning title=Videot::R2 ei käytössä: $(echo "$R" | jq -c '.errors' 2>/dev/null | head -c 300)"; fi
          {
            echo 'name = "faktapiste"'
            echo 'main = "src/index.js"'
            echo 'compatibility_date = "2026-09-01"'
            echo 'compatibility_flags = ["assets_navigation_has_no_effect"]'
            echo 'workers_dev = true'
            R=""
            if [ "${{ steps.cf.outputs.tila }}" = "active" ]; then
              R='{ pattern = "faktapiste.fi", custom_domain = true }, { pattern = "www.faktapiste.fi", custom_domain = true }'
            fi
            if [ "${{ steps.cf.outputs.netvo }}" = "active" ]; then
              if [ -n "$R" ]; then R="$R, "; fi
              R="$R{ pattern = \"netvo.fi\", custom_domain = true }, { pattern = \"www.netvo.fi\", custom_domain = true }"
            fi
            if [ -n "$R" ]; then echo "routes = [ $R ]"; fi
            echo '[vars]'
            echo 'KIRJAUTUMINEN = "${{ vars.FP_KIRJAUTUMINEN || 'auki' }}"'
            echo '[triggers]'
            echo 'crons = ["*/20 * * * *"]'
            echo '[assets]'
            echo 'directory = "./public"'
            echo 'binding = "ASSETS"'
            echo 'run_worker_first = true'
            echo 'not_found_handling = "404-page"'
            echo '[[durable_objects.bindings]]'
            echo 'name = "FP"'
            echo 'class_name = "Faktapiste"'
            echo '[[migrations]]'
            echo 'tag = "v1"'
            echo 'new_sqlite_classes = ["Faktapiste"]'
            if [ "$R2" = 1 ]; then echo '[[r2_buckets]]'; echo 'binding = "VIDEOT"'; echo 'bucket_name = "faktapiste-videot"'; fi
          } > wrangler.toml
          npx --yes wrangler@4.152.0 deploy
          HALLINTA=$(printf '%s' "$CLOUDFLARE_API_TOKEN-faktapiste" | sha256sum | cut -c1-40)
          jq -n --arg a "${{ secrets.ANTHROPIC_API_KEY }}" --arg b "${{ secrets.BREVO_API_KEY }}" --arg t "${{ secrets.TELEGRAM_BOT_TOKEN }}" --arg h "$HALLINTA" --arg ms "${{ secrets.MSADS_CLIENT_SECRET }}" --arg el "${{ secrets.ELEVENLABS_API_KEY }}" \
            '{ANTHROPIC_API_KEY:$a, BREVO_API_KEY:$b, TELEGRAM_BOT_TOKEN:$t, TG_CHAT:"1893930799", HALLINTA:$h, MSADS_CLIENT_SECRET:$ms, ELEVENLABS_API_KEY:$el}' > /tmp/s.json
          npx --yes wrangler@4.152.0 secret bulk /tmp/s.json; rm /tmp/s.json
          # Tyhjennä Cloudflaren välimuisti, jotta uudet sivut näkyvät heti (muuten vanha HTML voi jäädä reunavälimuistiin)
          for ZN in faktapiste.fi netvo.fi; do
            Z=$(curl -sS -H "Authorization: Bearer $CF" "$API/zones?name=$ZN" | jq -r '.result[0].id // empty')
            if [ -n "$Z" ]; then P=$(curl -sS -X POST "$API/zones/$Z/purge_cache" -H "Authorization: Bearer $CF" -H "content-type: application/json" -d '{"purge_everything":true}'); echo "::notice title=Välimuisti $ZN::$(echo "$P" | jq -c '{success, errors}')"; fi
          done
      - name: Savutesti
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          sleep 10
          U=https://faktapiste.${{ steps.cf.outputs.sub }}.workers.dev
          HALLINTA=$(printf '%s' "$CLOUDFLARE_API_TOKEN-faktapiste" | sha256sum | cut -c1-40)
          echo "::notice title=Testi::workers.dev $(curl -s -o /dev/null -w '%{http_code}' $U/)  palvelut $(curl -s -o /dev/null -w '%{http_code}' $U/palvelut/)  faktapiste.fi $(curl -s -o /dev/null -w '%{http_code}' https://faktapiste.fi/ || true)"
          echo "::notice title=Netvo::etusivu $(curl -s -o /dev/null -w '%{http_code}' https://netvo.fi/ || true)  ehdot $(curl -s -o /dev/null -w '%{http_code}' https://netvo.fi/ehdot/ || true)  malli $(curl -s -o /dev/null -w '%{http_code}' https://netvo.fi/mallit/parturi/ || true)"
          echo "::notice title=Linkkitesti::$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Dest: document' -H 'Accept: text/html' 'https://faktapiste.fi/api/vahvista?t=testi')"
          echo "::notice title=Sisäänluku::$(curl -sS -X POST -H "x-avain: $HALLINTA" $U/api/hallinta/sisaanluku | head -c 600)"
          echo "::notice title=Tila::$(curl -sS -X POST -H "x-avain: $HALLINTA" $U/api/hallinta/tila | head -c 600)"
          echo "::notice title=Arvonta::$(curl -sS $U/api/arvonta | head -c 500)"
          echo "::notice title=Kertakäyttö::$(curl -sS -X POST -H 'content-type: application/json' -d '{"email":"testi@yopmail.com"}' $U/api/kirjaudu | head -c 300)"
          echo "::notice title=Syöte::$(curl -sS "$U/api/syote?tab=suositut" | jq -c '[.postit[:6][] | {lahde, k: (.kortti.otsikko // .kortti.nyt // "")[:60]}]' | head -c 900)"
          if [ -n "${{ inputs.mm }}" ]; then echo "::notice title=MM::$(curl -sS -H "x-avain: $HALLINTA" "$U/api/hallinta/mm?u=$(jq -rn --arg q '${{ inputs.mm }}' '$q|@uri')" | head -c 3500)"; fi
          if [ -n "${{ inputs.fakta }}" ]; then echo "::notice title=Fakta::$(curl -sS -X POST -H "x-avain: $HALLINTA" -H 'content-type: application/json' -d "$(jq -n --arg q '${{ inputs.fakta }}' '{kysymys:$q}')" $U/api/hallinta/fakta | jq -c "{v: .kortti.vastaus, a: .kortti.aanestys.otsikko, l: .kortti.aanestys.lisaotsikko, r: .kortti.aanestys.ryhmat[:3], e: .virhe}" | head -c 2500)"; fi
      - name: Kutsulinkki Telegramiin
        if: inputs.kutsu != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          U=https://faktapiste.${{ steps.cf.outputs.sub }}.workers.dev
          HALLINTA=$(printf '%s' "$CLOUDFLARE_API_TOKEN-faktapiste" | sha256sum | cut -c1-40)
          L=$(curl -sS -X POST -H "x-avain: $HALLINTA" -H 'content-type: application/json' -d '{"max": ${{ inputs.kutsu }}}' $U/api/hallinta/kutsu | jq -r .linkki)
          curl -sS -X POST "https://api.telegram.org/bot$TG/sendMessage" -d chat_id=1893930799 --data-urlencode "text=🔑 Faktapisteen beta-kutsulinkki (${{ inputs.kutsu }} käyttäjää): $L" | jq -c .ok
          if [ -n "${{ inputs.salaus }}" ]; then printf '%s' "${{ inputs.salaus }}" | base64 -d > jul.pem; echo "::notice title=Salattu::$(printf '%s' "$L" | openssl pkeyutl -encrypt -pubin -inkey jul.pem | base64 -w0)"; fi
