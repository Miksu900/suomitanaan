name: Vastinevahti (Yle-pikaajo)
# Rinnakkainen Yle-kokoelma-ajo: jakaa ohjelmat usealle koneelle, nopeampi litterointi. Ei tallenna tilaa.
on:
  workflow_dispatch:
    inputs:
      offset: { description: "Ohita näin monta parasta ohjelmaa (pääajo käsittelee ne)", required: false, default: "14" }
      maxv: { description: "Ohjelmia yhteensä", required: false, default: "15" }
      koneita: { description: "Rinnakkaisia koneita (1-20)", required: false, default: "3" }
      raja: { description: "Otsikkoseulonnan alaraja 0-3", required: false, default: "2" }
      ohita: { description: "Pilkulla eroteltu lista jo käsitellyistä Areena-id:istä", required: false, default: "" }
      minvuosi: { description: "Vain ohjelmat tästä vuodesta alkaen", required: false, default: "" }
      shardit: { description: "JSON-lista 0..koneita-1", required: false, default: "[0,1,2]" }
      laaja: { description: "1 = kaikki aiheet (ilmasto, sukupuoli, talous...)", required: false, default: "" }
      loysa: { description: "1 = löysempi valinta (yksipuolinen haastateltava ilman vastakantaa kelpaa)", required: false, default: "" }
jobs:
  aja:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix: { shard: "${{ fromJSON(inputs.shardit) }}" }
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
          pip install -q -U yt-dlp faster-whisper pillow
          git fetch -q origin vastinevahti-tila && git show origin/vastinevahti-tila:vastinevahti.json > mainokset/vastinevahti.json || true
      - env:
          AK: ${{ secrets.ANTHROPIC_API_KEY }}
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TILA: molemmat
          VAIN: yle
          MAXV: ${{ inputs.maxv }}
          OFFSET: ${{ inputs.offset }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.koneita }}
          NROETU: "P${{ matrix.shard }}-"
          EI_TILAA: "1"
          EI_TG: "1"
          RAJA: ${{ inputs.raja }}
          OHITA: ${{ inputs.ohita }}
          MINVUOSI: ${{ inputs.minvuosi }}
          LOYSA: ${{ inputs.loysa }}
          LAAJA: ${{ inputs.laaja }}
          WHISPER: base
          BEAM: "1"
          TAPAHTUMA: pika
        run: cd mainokset && python3 vastinevahti.py
