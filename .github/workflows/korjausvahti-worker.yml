name: Korjausvahdin sinetöijä (Cloudflare Worker)
# Julkaisee 5 minuutin välein ajettavan sinetöijän. Luo ensimmäisellä kerralla oman Sepolia-lompakon,
# jonka avain tallennetaan vain Cloudflaren salaisuudeksi (ei näy missään).
on:
  push:
    branches: [main]
    paths: ["korjausvahti-worker/**", ".github/workflows/korjausvahti-worker.yml"]
  workflow_dispatch:
    inputs:
      sopimus: { description: "Aikaleima-sopimuksen osoite", default: "" }
permissions:
  contents: write
jobs:
  julkaise:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tili ja tallennustila
        id: cf
        run: |
          set -e
          h=(-sS -H "Authorization: Bearer $CF" -H "Content-Type: application/json")
          A=$(curl "${h[@]}" "$API/accounts" | jq -r '.result[0].id'); echo "account=$A" >> $GITHUB_OUTPUT
          KV=$(curl "${h[@]}" "$API/accounts/$A/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="korjausvahti-db") | .id' | head -1)
          [ -n "$KV" ] || KV=$(curl "${h[@]}" -X POST "$API/accounts/$A/storage/kv/namespaces" -d '{"title":"korjausvahti-db"}' | jq -r '.result.id')
          echo "kv=$KV" >> $GITHUB_OUTPUT
          SUB=$(curl "${h[@]}" "$API/accounts/$A/workers/subdomain" | jq -r '.result.subdomain // empty'); echo "sub=$SUB" >> $GITHUB_OUTPUT
      - name: Julkaise
        working-directory: korjausvahti-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
        run: |
          set -e
          npm install --no-audit --no-fund
          SOP="${{ inputs.sopimus }}"; [ -n "$SOP" ] || SOP=$(cat sopimus.txt 2>/dev/null || true)
          cat > wrangler.toml <<EOF
          name = "korjausvahti-sinetoija"
          main = "src/index.js"
          compatibility_date = "2026-09-01"
          compatibility_flags = ["nodejs_compat"]
          workers_dev = true
          [triggers]
          crons = ["*/5 * * * *"]
          [vars]
          DATA_URL = "https://nytpuhutaan.fi/muutokset.json"
          SOPIMUS = "$SOP"
          [[kv_namespaces]]
          binding = "DB"
          id = "${{ steps.cf.outputs.kv }}"
          EOF
          sed -i 's/^ *//' wrangler.toml
          npx --yes wrangler@3.99.0 deploy
          if ! npx --yes wrangler@3.99.0 secret list 2>/dev/null | grep -q SINETOIJA_KEY; then
            node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))' | sed 's/^/0x/' | tr -d '\n' | npx --yes wrangler@3.99.0 secret put SINETOIJA_KEY
            node -e 'console.log(require("crypto").randomBytes(16).toString("hex"))' | tr -d '\n' | npx --yes wrangler@3.99.0 secret put AJO_AVAIN
            echo "::notice title=Lompakko::Uusi sinetöijälompakko luotu"
          fi
          if [ -n "$SOP" ] && [ "$SOP" != "$(cat sopimus.txt 2>/dev/null)" ]; then echo -n "$SOP" > sopimus.txt; fi
          sleep 8
          echo "::notice title=Tila::$(curl -s https://korjausvahti-sinetoija.${{ steps.cf.outputs.sub }}.workers.dev/)"
      - name: Tallenna sopimuksen osoite
        run: |
          git config user.name "julkaisija"; git config user.email "julkaisija@users.noreply.github.com"
          git add korjausvahti-worker/sopimus.txt 2>/dev/null && (git commit -m "Korjausvahti: sopimuksen osoite" && git pull --rebase && git push) || true
